name: Android APK — Free Build

on:
  push:
    branches: [main]
    paths:
      - 'Letsfiling/frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Letsfiling/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Letsfiling/frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.letslegal.in

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.letslegal.in

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: letslegal-android-apk
          path: Letsfiling/frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Letslegal v1.0.${{ github.run_number }}"
          files: Letsfiling/frontend/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
