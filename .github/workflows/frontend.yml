name: Frontend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Letsfiling/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Letsfiling/frontend/**'

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Letsfiling/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Letsfiling/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        env:
          EXPO_PUBLIC_API_BASE_URL: https://ijxuemyxtd.execute-api.ap-south-1.amazonaws.com/prod
        run: npx expo export --platform web --output-dir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: Letsfiling/frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist s3://letsfiling-web \
            --acl public-read \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" \
            --exclude "metadata.json"

          # index.html should not be cached
          aws s3 cp dist/index.html s3://letsfiling-web/index.html \
            --acl public-read \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1XJCIEG4FJIO1 \
            --paths "/*" \
            --region us-east-1

      - name: Smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://d3q5mb421oguqi.cloudfront.net)
          echo "Web app status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Deploy successful" || (echo "❌ Web check failed" && exit 1)
